<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدار  تسجيل تاجر جديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1A0A4A 0%, #2D1270 50%, #481DBC 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 24px 80px rgba(0,0,0,.3);
  }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo-sub { font-size: 12px; color: #999; margin-top: 3px; }
  .card-title { font-size: 19px; font-weight: 700; color: #1A0A4A; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: #888; margin-bottom: 24px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #444; margin-bottom: 5px; }
  input, select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #E0DBF0;
    border-radius: 10px;
    font-size: 13.5px;
    font-family: inherit;
    color: #1A0A4A;
    background: #FAFAFA;
    transition: border-color .2s;
    direction: rtl;
  }
  input[type="email"], input[type="password"], input[type="tel"] { direction: ltr; text-align: right; }
  input:focus, select:focus { outline: none; border-color: #481DBC; box-shadow: 0 0 0 3px rgba(72,29,188,.1); background:#fff; }
  input::placeholder { color: #bbb; }
  .service-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .svc-card {
    border: 2px solid #E0DBF0; border-radius: 12px; padding: 14px 10px;
    text-align: center; cursor: pointer; transition: all .2s; background: #FAFAFA;
  }
  .svc-card:hover { border-color: #481DBC; background: #F5F2FF; }
  .svc-card.selected { border-color: #481DBC; background: #F0EBFF; box-shadow: 0 0 0 3px rgba(72,29,188,.12); }
  .svc-icon { display:flex; justify-content:center; margin-bottom:8px; color:#481DBC; }
  .svc-card.selected .svc-icon { color:#481DBC; }
  .svc-name { font-size: 14px; font-weight: 700; color: #1A0A4A; }
  .svc-desc { font-size: 11px; color: #888; margin-top: 3px; }
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: #481DBC;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    transition: background .2s;
  }
  .btn-primary:hover { background: #3a169a; }
  .error-msg {
    background: #FEE2E2; border: 1px solid #FECACA; color: #DC2626;
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
    margin-bottom: 12px; display: none;
  }
  .success-msg {
    background: #DCFCE7; border: 1px solid #BBF7D0; color: #15803D;
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
    margin-bottom: 12px; display: none;
  }
  .link-row { text-align: center; font-size: 13px; color: #888; margin-top: 16px; }
  .link-row a { color: #481DBC; font-weight: 600; text-decoration: none; }
  .badge-merchant {
    display: inline-flex; align-items: center; gap: 6px;
    background: #F4F2FB; color: #481DBC; border: 1px solid #D8D3EE;
    border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600;
    margin-bottom: 18px;
  }
  .divider-line { border: none; border-top: 1px solid #E0DBF0; margin: 16px 0; }
  .section-label {
    font-size: 11px; font-weight: 700; color: #481DBC;
    letter-spacing: 0.5px; text-transform: uppercase;
    margin: 16px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid #EDE8FF;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="logo.png" alt="Madar" style="height:64px;margin-bottom:4px;">
    <div class="logo-sub">بوابة التجار</div>
  </div>

  <div class="badge-merchant">🏪 بوابة التجار</div>
  <div class="card-title">حساب تاجر جديد</div>
  <div class="card-sub">سجّل متجرك وابدأ شحنك مع مدار</div>

  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg">✅ تم إنشاء الحساب! جاري التحويل...</div>

  <div class="section-label">بيانات المسؤول</div>
  <div class="row-2">
    <div class="field">
      <label>الاسم الأول</label>
      <input type="text" id="firstName" placeholder="محمد" />
    </div>
    <div class="field">
      <label>الاسم الأخير</label>
      <input type="text" id="lastName" placeholder="العمري" />
    </div>
  </div>

  <div class="field">
    <label>رقم الجوال</label>
    <input type="tel" id="phone" placeholder="05XXXXXXXX" />
  </div>

  <div class="field">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="merchant@store.com" />
  </div>

  <div class="section-label">بيانات المتجر</div>
  <div class="field">
    <label>اسم المتجر / المنشأة</label>
    <input type="text" id="storeName" placeholder="متجر الأمل التجاري" />
  </div>

  <div class="row-2">
    <div class="field">
      <label>نوع النشاط</label>
      <select id="businessType">
        <option value="تجارة إلكترونية">تجارة إلكترونية</option>
        <option value="بيع بالتجزئة">بيع بالتجزئة</option>
        <option value="بيع بالجملة">بيع بالجملة</option>
        <option value="مطاعم وكافيهات">مطاعم وكافيهات</option>
        <option value="موردين">موردين</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="field">
      <label>المنطقة</label>
      <select id="region">
        <option value="الرياض">الرياض</option>
        <option value="جدة">جدة</option>
        <option value="مكة المكرمة">مكة المكرمة</option>
        <option value="المدينة المنورة">المدينة المنورة</option>
        <option value="الدمام">الدمام</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
  </div>

  <div class="section-label">الخدمة المطلوبة</div>
  <div class="field">
    <div class="service-cards">
      <label class="svc-card" onclick="selectService(this,'شحن')">
        <input type="radio" name="service" value="شحن" style="display:none">
        <div class="svc-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        </div>
        <div class="svc-name">شحن</div>
        <div class="svc-desc">توصيل الطلبات للعملاء</div>
      </label>
      <label class="svc-card" onclick="selectService(this,'تخزين')">
        <input type="radio" name="service" value="تخزين" style="display:none">
        <div class="svc-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="svc-name">تخزين</div>
        <div class="svc-desc">تخزين بضاعتك في مستودعاتنا</div>
      </label>
      <label class="svc-card" onclick="selectService(this,'شحن وتخزين')">
        <input type="radio" name="service" value="شحن وتخزين" style="display:none">
        <div class="svc-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <div class="svc-name">شحن وتخزين</div>
        <div class="svc-desc">الحلّ المتكامل</div>
      </label>
    </div>
  </div>

  <div class="section-label">كلمة المرور</div>
  <div class="row-2">
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" />
    </div>
  </div>

  <button class="btn-primary" onclick="register()">إنشاء الحساب وبدء الشحن →</button>

  <div class="link-row">
    لديك حساب بالفعل؟ <a href="merchant-login.html">تسجيل الدخول</a>
  </div>
</div>

<script>
  if (localStorage.getItem('madar_merchant')) {
    window.location.href = 'merchant-dashboard.html';
  }

  let selectedService = '';
  function selectService(el, val) {
    document.querySelectorAll('.svc-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedService = val;
  }

  function register() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName  = document.getElementById('lastName').value.trim();
    const phone     = document.getElementById('phone').value.trim();
    const email     = document.getElementById('email').value.trim();
    const storeName = document.getElementById('storeName').value.trim();
    const businessType = document.getElementById('businessType').value;
    const region    = document.getElementById('region').value;
    const password  = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg  = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!firstName || !lastName || !email || !storeName || !password || !phone) {
      errorMsg.textContent = 'يرجى ملء جميع الحقول المطلوبة';
      errorMsg.style.display = 'block'; return;
    }
    if (!selectedService) {
      errorMsg.textContent = 'يرجى اختيار الخدمة المطلوبة';
      errorMsg.style.display = 'block'; return;
    }
    if (password.length < 6) {
      errorMsg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
      errorMsg.style.display = 'block'; return;
    }
    if (password !== confirmPassword) {
      errorMsg.textContent = 'كلمتا المرور غير متطابقتين';
      errorMsg.style.display = 'block'; return;
    }

    const merchants = JSON.parse(localStorage.getItem('madar_merchants') || '[]');
    if (merchants.find(m => m.email === email)) {
      errorMsg.textContent = 'هذا البريد الإلكتروني مسجل مسبقاً';
      errorMsg.style.display = 'block'; return;
    }

    const merchantId = 'MAD-' + String(Math.floor(10000 + Math.random() * 90000));
    const newMerchant = {
      id: merchantId,
      firstName, lastName,
      name: firstName + ' ' + lastName,
      phone, email, password,
      storeName, businessType, region, service: selectedService,
      createdAt: new Date().toISOString(),
      status: 'نشط'
    };

    merchants.push(newMerchant);
    localStorage.setItem('madar_merchants', JSON.stringify(merchants));
    localStorage.setItem('madar_merchant', JSON.stringify(newMerchant));

    successMsg.style.display = 'block';
    setTimeout(() => window.location.href = 'merchant-dashboard.html', 1200);
  }

  document.addEventListener('keypress', e => { if (e.key === 'Enter') register(); });
</script>
</body>
</html>
