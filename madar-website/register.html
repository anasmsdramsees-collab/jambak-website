<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدار  إنشاء حساب إدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1A0A4A 0%, #2D1270 50%, #481DBC 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 24px 80px rgba(0,0,0,.3);
  }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo-sub { font-size: 12px; color: #999; margin-top: 3px; }
  .card-title { font-size: 19px; font-weight: 700; color: #1A0A4A; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: #888; margin-bottom: 24px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #444; margin-bottom: 5px; }
  input, select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #E0DBF0;
    border-radius: 10px;
    font-size: 13.5px;
    font-family: inherit;
    color: #1A0A4A;
    background: #FAFAFA;
    transition: border-color .2s;
    direction: rtl;
  }
  input[type="email"], input[type="password"] { direction: ltr; text-align: right; }
  input:focus, select:focus { outline: none; border-color: #481DBC; box-shadow: 0 0 0 3px rgba(72,29,188,.1); background:#fff; }
  input::placeholder { color: #bbb; }
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: #481DBC;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    transition: background .2s;
  }
  .btn-primary:hover { background: #3a169a; }
  .error-msg {
    background: #FEE2E2; border: 1px solid #FECACA; color: #DC2626;
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
    margin-bottom: 12px; display: none;
  }
  .success-msg {
    background: #DCFCE7; border: 1px solid #BBF7D0; color: #15803D;
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
    margin-bottom: 12px; display: none;
  }
  .link-row { text-align: center; font-size: 13px; color: #888; margin-top: 16px; }
  .link-row a { color: #481DBC; font-weight: 600; text-decoration: none; }
  .badge-admin {
    display: inline-flex; align-items: center; gap: 6px;
    background: #F4F2FB; color: #481DBC; border: 1px solid #D8D3EE;
    border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600;
    margin-bottom: 18px;
  }
  .divider-line { border: none; border-top: 1px solid #F0EEF9; margin: 16px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="logo.png" alt="Madar" style="height:64px;margin-bottom:4px;">
    <div class="logo-sub">منصة الخدمات اللوجستية</div>
  </div>

  <div class="badge-admin">🔐 إنشاء حساب إدارة</div>
  <div class="card-title">حساب جديد</div>
  <div class="card-sub">أنشئ حساب إداري للوصول للوحة التحكم</div>

  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg">✅ تم إنشاء الحساب! جاري التحويل...</div>

  <div class="row-2">
    <div class="field">
      <label>الاسم الأول</label>
      <input type="text" id="firstName" placeholder="أنس" />
    </div>
    <div class="field">
      <label>الاسم الأخير</label>
      <input type="text" id="lastName" placeholder="الإمام" />
    </div>
  </div>

  <div class="field">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="admin@madarlogistic.com" />
  </div>

  <div class="field">
    <label>الدور الوظيفي</label>
    <select id="role">
      <option value="مدير عام">مدير عام</option>
      <option value="مدير تشغيل">مدير تشغيل</option>
      <option value="مدير مالي">مدير مالي</option>
      <option value="مشرف مستودع">مشرف مستودع</option>
      <option value="مدير">مدير</option>
    </select>
  </div>

  <div class="row-2">
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" />
    </div>
  </div>

  <button class="btn-primary" onclick="register()">إنشاء الحساب →</button>

  <div class="link-row">
    لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
  </div>
</div>

<script>
  if (localStorage.getItem('madar_user')) {
    window.location.href = 'dashboard.html';
  }

  function register() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const role = document.getElementById('role').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!firstName || !lastName || !email || !password) {
      errorMsg.textContent = 'يرجى ملء جميع الحقول المطلوبة';
      errorMsg.style.display = 'block';
      return;
    }
    if (password.length < 6) {
      errorMsg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
      errorMsg.style.display = 'block';
      return;
    }
    if (password !== confirmPassword) {
      errorMsg.textContent = 'كلمتا المرور غير متطابقتين';
      errorMsg.style.display = 'block';
      return;
    }

    const users = JSON.parse(localStorage.getItem('madar_users') || '[]');
    if (users.find(u => u.email === email)) {
      errorMsg.textContent = 'هذا البريد الإلكتروني مسجل مسبقاً';
      errorMsg.style.display = 'block';
      return;
    }

    const newUser = {
      id: Date.now(),
      firstName, lastName,
      name: firstName + ' ' + lastName,
      email, password, role,
      createdAt: new Date().toISOString()
    };

    users.push(newUser);
    localStorage.setItem('madar_users', JSON.stringify(users));
    localStorage.setItem('madar_user', JSON.stringify(newUser));

    successMsg.style.display = 'block';
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  }

  document.addEventListener('keypress', e => { if (e.key === 'Enter') register(); });
</script>
</body>
</html>
