<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>الصفحة غير موجودة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:linear-gradient(135deg,#1A0A4A,#481DBC); min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; direction:rtl; }
  .box { text-align:center; padding:40px; }
  .code { font-size:80px; font-weight:900; opacity:.15; line-height:1; }
  .title { font-size:22px; font-weight:700; margin:12px 0 8px; }
  .sub { font-size:14px; opacity:.6; margin-bottom:24px; }
  a { display:inline-block; padding:11px 28px; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.25); border-radius:10px; color:#fff; text-decoration:none; font-weight:700; font-size:14px; transition:background .2s; }
  a:hover { background:rgba(255,255,255,.2); }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <div class="title">الصفحة غير موجودة</div>
  <div class="sub">هذه الصفحة غير متاحة أو تم نقلها</div>
  <a href="index.html">→ العودة للدخول</a>
</div>
</body>
</html>
