<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Label — Madar</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #ccc;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
  gap: 14px;
}

/* ── ACTIONS ── */
.actions {
  display: flex; gap: 10px;
  background: #fff; padding: 10px 18px;
  border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
  width: 148mm; justify-content: flex-end;
}
.btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-print { background: #481DBC; color: #fff; }
.btn-print:hover { background: #3a169a; }
.btn-back  { background: #eee; color: #333; }
.btn-back:hover { background: #ddd; }

/* ── LABEL SHEET ── */
.label {
  width: 148mm;
  background: #fff;
  border: 2px solid #000;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 8pt;
  color: #000;
}

/* ── ROW HELPER ── */
.row { display: flex; border-bottom: 1.5px solid #000; }
.row:last-child { border-bottom: none; }
.cell {
  padding: 3px 5px;
  border-right: 1.5px solid #000;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cell:last-child { border-right: none; }

/* ROW 1: Logo + Barcode */
.r1-logo { width: 36mm; padding: 4px 6px; }
.r1-logo img { height: 28px; }
.r1-barcode { flex: 1; padding: 4px 6px 2px; align-items: flex-end; }
.r1-barcode svg { max-width: 100%; height: 32px; }
.tracking-num { font-size: 8pt; font-weight: 700; letter-spacing: 1px; text-align: right; margin-top: 1px; }

/* ROW 2: Origin / Dest / Meta */
.r2-origin { width: 36mm; padding: 4px 6px; }
.r2-dest   { width: 36mm; padding: 4px 6px; border-right: 1.5px solid #000; }
.r2-meta   { flex: 1; padding: 4px 6px; }
.lbl-small { font-size: 6.5pt; color: #555; }
.city-big  { font-size: 26pt; font-weight: 900; line-height: 1; letter-spacing: -1px; }
.meta-row  { display: flex; gap: 4px; align-items: baseline; margin-bottom: 2px; }
.meta-lbl  { font-size: 6.5pt; color: #555; width: 56px; }
.meta-val  { font-size: 7.5pt; font-weight: 700; }

/* ROW 3: Service Codes — big boxes */
.r3 { display: flex; border-bottom: 1.5px solid #000; }
.svc-box {
  flex: 1; text-align: center;
  padding: 6px 4px; border-right: 1.5px solid #000;
  font-size: 18pt; font-weight: 900; letter-spacing: 1px;
  line-height: 1;
}
.svc-box:last-child { border-right: none; }
.svc-box.highlight { background: #000; color: #fff; }

/* ROW 4: Weight / Pieces */
.r4 { display: flex; border-bottom: 1.5px solid #000; }
.r4 .cell { font-size: 7.5pt; }
.r4 .cell strong { font-size: 9pt; }

/* ROW 5: Services bar */
.r5-svc {
  background: #000; color: #fff;
  padding: 3px 6px; font-size: 8.5pt; font-weight: 700;
  letter-spacing: 0.5px;
  border-bottom: 1.5px solid #000;
}

/* ROW 6: COD */
.r6-cod { border-bottom: 1.5px solid #000; padding: 3px 6px; font-size: 7.5pt; }
.cod-val { font-size: 11pt; font-weight: 900; color: #c00; }

/* ROW 7: Account */
.r7-acct { border-bottom: 1.5px solid #000; padding: 3px 6px; }
.acct-lbl { font-size: 6.5pt; color: #555; }
.acct-num { font-size: 11pt; font-weight: 900; }

/* ROW 8: Addresses + vertical barcode */
.r8 { display: flex; border-bottom: 1.5px solid #000; min-height: 50mm; }
.r8-addr { flex: 1; padding: 5px 6px; border-right: 1.5px solid #000; }
.r8-addr.right { border-right: none; }
.addr-type { font-size: 6.5pt; color: #555; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.addr-name { font-size: 10pt; font-weight: 900; line-height: 1.2; }
.addr-company { font-size: 8.5pt; font-weight: 700; margin-bottom: 2px; }
.addr-line { font-size: 7.5pt; line-height: 1.4; }
.addr-phone { font-size: 8pt; font-weight: 700; margin-top: 4px; letter-spacing: 0.5px; }
.r8-vbar { width: 12mm; display: flex; align-items: center; justify-content: center; padding: 3px 2px; }
.r8-vbar svg { transform: rotate(90deg); }

/* ROW 9: Footer refs */
.r9-footer { padding: 3px 6px; font-size: 6.5pt; display: flex; justify-content: space-between; }
.r9-footer span { color: #333; }
.r9-footer strong { font-size: 7.5pt; }

/* ── PRINT ── */
@media print {
  body { background: #fff; padding: 0; }
  .actions { display: none !important; }
  .label { border: 1.5px solid #000; box-shadow: none; }
  @page { margin: 4mm; size: A5; }
}
</style>
</head>
<body>

<div class="actions">
  <button class="btn btn-back" onclick="history.back()">&#8592; Back</button>
  <button class="btn btn-print" onclick="window.print()">&#128438; Print Label</button>
</div>

<div class="label" id="label">

  <!-- ROW 1: LOGO + BARCODE -->
  <div class="row">
    <div class="cell r1-logo">
      <img src="logo.png" alt="MADAR" onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'">
      <div id="logo-text" style="display:none;font-size:18pt;font-weight:900;color:#481DBC;letter-spacing:-1px;">MADAR</div>
    </div>
    <div class="cell r1-barcode">
      <svg id="barcode-h"></svg>
      <div class="tracking-num" id="tracking-display"></div>
    </div>
  </div>

  <!-- ROW 2: ORIGIN / DESTINATION / META -->
  <div class="row">
    <div class="cell r2-origin">
      <div class="lbl-small">Origin:</div>
      <div class="city-big" id="city-origin">RUH</div>
    </div>
    <div class="cell r2-dest">
      <div class="lbl-small">Destination:</div>
      <div class="city-big" id="city-dest">RUH</div>
    </div>
    <div class="cell r2-meta" style="flex:1">
      <div class="meta-row">
        <span class="meta-lbl">Date:</span>
        <span class="meta-val" id="lbl-date"></span>
      </div>
      <div class="meta-row">
        <span class="meta-lbl">Order Ref:</span>
        <span class="meta-val" id="lbl-order"></span>
      </div>
      <div class="meta-row">
        <span class="meta-lbl">Merchant ID:</span>
        <span class="meta-val" id="lbl-merchant"></span>
      </div>
    </div>
  </div>

  <!-- ROW 3: SERVICE CODE BOXES -->
  <div class="r3">
    <div class="svc-box" id="svc-type">DOM</div>
    <div class="svc-box highlight" id="svc-code">EXP</div>
    <div class="svc-box" id="svc-pkg-code">P</div>
  </div>

  <!-- ROW 4: PIECES / WEIGHT / CHARGEABLE -->
  <div class="r4">
    <div class="cell" style="width:33%">
      <span class="lbl-small">Pieces:</span>
      <strong id="lbl-pieces">1</strong>
    </div>
    <div class="cell" style="width:33%">
      <span class="lbl-small">Weight:</span>
      <strong id="lbl-weight">0.5 KG</strong>
    </div>
    <div class="cell" style="flex:1">
      <span class="lbl-small">Chargeable:</span>
      <strong id="lbl-chargeable">0.5 KG</strong>
    </div>
  </div>

  <!-- ROW 5: SERVICE BAR -->
  <div class="r5-svc">Services: <span id="lbl-service-bar">Standard Delivery</span></div>

  <!-- ROW 6: COD (shown only if cod > 0) -->
  <div class="r6-cod" id="cod-row" style="display:none">
    <span class="lbl-small">Cash on Delivery (COD):</span>
    <span class="cod-val" id="lbl-cod"></span>
    <span style="font-size:7.5pt"> SAR</span>
    <span style="float:right;font-size:7pt;color:#666;">Customs: &mdash;</span>
  </div>

  <!-- ROW 7: ACCOUNT -->
  <div class="r7-acct">
    <div class="acct-lbl">Merchant Account</div>
    <div class="acct-num" id="lbl-acct-num">MAD-00000</div>
    <div style="font-size:8.5pt;font-weight:700;margin-top:1px;" id="lbl-store-name"></div>
  </div>

  <!-- ROW 8: RECIPIENT + SENDER + VERTICAL BARCODE -->
  <div class="r8">
    <div class="r8-addr" style="flex:1">
      <div class="addr-type">Consignee (Recipient)</div>
      <div class="addr-name" id="to-name"></div>
      <div class="addr-line" id="to-addr"></div>
      <div class="addr-line" id="to-city-country"></div>
      <div class="addr-phone" id="to-phone"></div>
    </div>
    <div class="r8-vbar">
      <svg id="barcode-v" width="70" height="10"></svg>
    </div>
    <div class="r8-addr right" style="flex:1">
      <div class="addr-type">Shipper (Sender)</div>
      <div class="addr-name" id="from-name"></div>
      <div class="addr-line" id="from-addr"></div>
      <div class="addr-line" id="from-city-country"></div>
      <div class="addr-phone" id="from-phone"></div>
    </div>
  </div>

  <!-- ROW 9: FOOTER REFS -->
  <div class="r9-footer">
    <span>Shipper Ref: <strong id="footer-order"></strong></span>
    <span>Consignee Ref: <strong id="footer-tracking"></strong></span>
    <span>Description: <strong id="footer-desc"></strong></span>
  </div>

</div><!-- /label -->

<script>
/* ── CITY MAPS ── */
const CITY_CODE = {
  'الرياض':'RUH','جدة':'JED','الدمام':'DMM','مكة المكرمة':'MEC',
  'المدينة المنورة':'MED','الطائف':'TIF','أبها':'AHB','تبوك':'TUU',
  'حائل':'HAS','جازان':'GIZ','نجران':'EAM','الباحة':'ABT','القصيم':'ULH',
  'عرعر':'RAE','سكاكا':'AJF'
};
const SVC_CODE = {
  'شحن':'EXP','تخزين وشحن':'EXP','شحن وتخزين':'EXP','standard':'STD'
};
const PKG_CODE = {
  'عادي':'P','مجمد':'F','هش':'F','ثقيل':'H','normal':'P','frozen':'F'
};
const SVC_EN = {
  'شحن':'Standard Delivery','شحن وتخزين':'Express + Storage',
  'تخزين وشحن':'Express + Storage'
};

/* ── LOAD DATA ── */
let D = {};
try { D = JSON.parse(localStorage.getItem('madar_label') || '{}'); } catch(e) {}
if (!D.tracking) {
  const p = new URLSearchParams(location.search);
  if (p.get('tracking')) {
    D = {
      tracking: p.get('tracking') || 'MDR0000000001',
      id: p.get('id') || 'ORD-00001',
      toName: p.get('toName') || 'John Doe',
      toAddr: p.get('toAddr') || '123 Main Street',
      toPhone: p.get('toPhone') || '',
      fromName: p.get('fromName') || 'MADAR Store',
      fromAddr: p.get('fromAddr') || 'Riyadh, Saudi Arabia',
      fromPhone: p.get('fromPhone') || '',
      city: p.get('city') || 'الرياض',
      service: p.get('service') || 'شحن',
      weight: p.get('weight') || '0.5',
      pieces: p.get('pieces') || '1',
      pkg: p.get('pkg') || 'عادي',
      cod: p.get('cod') || '0',
      desc: p.get('desc') || 'General Goods',
      merchantId: p.get('merchantId') || 'MAD-00000',
      storeName: p.get('storeName') || ''
    };
  }
}

/* ── FALLBACK DEMO DATA ── */
if (!D.tracking) {
  D = {
    tracking:'MDR202500001',id:'ORD-2025-001',
    toName:'Ahmed Al-Rashidi',toAddr:'King Fahd Road, Al Olaya District',
    toPhone:'0501234567',fromName:'Store Manager',
    fromAddr:'Industrial Area, Riyadh',fromPhone:'0112345678',
    city:'الرياض',service:'شحن',weight:'1.5',pieces:'1',
    pkg:'عادي',cod:'150',desc:'General Merchandise',
    merchantId:'MAD-10399',storeName:'Al Amal Trading'
  };
}

/* ── CITY ORIGIN (from-city) ── */
const originCity = D.fromCity || 'الرياض';
const destCity   = D.city     || 'الرياض';
const originCode = CITY_CODE[originCity] || 'RUH';
const destCode   = CITY_CODE[destCity]   || 'RUH';

/* ── FILL DOM ── */
document.getElementById('city-origin').textContent  = originCode;
document.getElementById('city-dest').textContent    = destCode;
document.getElementById('tracking-display').textContent = D.tracking;
document.getElementById('lbl-date').textContent     = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('lbl-order').textContent    = D.id || '';
document.getElementById('lbl-merchant').textContent = D.merchantId || '';
document.getElementById('lbl-pieces').textContent   = (D.pieces || '1');
document.getElementById('lbl-weight').textContent   = (D.weight || '0.5') + ' KG';
document.getElementById('lbl-chargeable').textContent = (D.weight || '0.5') + ' KG';
document.getElementById('lbl-service-bar').textContent = SVC_EN[D.service] || 'Standard Delivery';
document.getElementById('lbl-acct-num').textContent = D.merchantId || '';
document.getElementById('lbl-store-name').textContent = D.storeName || '';
document.getElementById('to-name').textContent      = D.toName || '';
document.getElementById('to-addr').textContent      = D.toAddr || '';
document.getElementById('to-city-country').textContent = (CITY_CODE[D.city] ? D.city + ' — SA' : 'SA');
document.getElementById('to-phone').textContent     = D.toPhone || '';
document.getElementById('from-name').textContent    = D.fromName || '';
document.getElementById('from-addr').textContent    = D.fromAddr || '';
document.getElementById('from-city-country').textContent = (D.fromCity || 'Riyadh') + ' — SA';
document.getElementById('from-phone').textContent   = D.fromPhone || '';
document.getElementById('footer-order').textContent = D.id || '';
document.getElementById('footer-tracking').textContent = D.tracking;
document.getElementById('footer-desc').textContent  = D.desc || 'General Goods';

/* Service code boxes */
document.getElementById('svc-type').textContent     = 'DOM';
document.getElementById('svc-code').textContent     = SVC_CODE[D.service] || 'EXP';
document.getElementById('svc-pkg-code').textContent = PKG_CODE[D.pkg] || 'P';

/* COD row */
const codVal = parseFloat(D.cod || 0);
if (codVal > 0) {
  document.getElementById('cod-row').style.display = 'block';
  document.getElementById('lbl-cod').textContent   = codVal.toFixed(2);
}

/* ── BARCODES ── */
JsBarcode('#barcode-h', D.tracking, {
  format:'CODE128', width:1.6, height:40,
  displayValue:false, margin:0, background:'#ffffff', lineColor:'#000000'
});
JsBarcode('#barcode-v', D.tracking, {
  format:'CODE128', width:1.2, height:60,
  displayValue:false, margin:0, background:'#ffffff', lineColor:'#000000'
});
</script>
</body>
</html>
