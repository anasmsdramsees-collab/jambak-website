<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Label — Madar</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #b0b0b0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 24px 16px 40px;
  gap: 12px;
  min-height: 100vh;
}

/* ── ACTIONS BAR ── */
.actions {
  display: flex;
  gap: 8px;
  background: #fff;
  padding: 9px 16px;
  border-radius: 8px;
  box-shadow: 0 2px 10px rgba(0,0,0,.2);
  width: 148mm;
  justify-content: flex-end;
}
.btn {
  padding: 7px 18px;
  border: none;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: Arial, sans-serif;
}
.btn-print { background: #481DBC; color: #fff; }
.btn-print:hover { background: #3a169a; }
.btn-back  { background: #eee; color: #333; }
.btn-back:hover { background: #ddd; }

/* ══════════════════════════════
   LABEL — exactly A5 (148×210mm)
   ══════════════════════════════ */
.label {
  width: 148mm;
  height: 210mm;
  background: #fff;
  border: 1.5px solid #000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 7.5pt;
  color: #000;
}

/* shared border util */
.bb { border-bottom: 1px solid #000; }
.br { border-right:  1px solid #000; }
.bt { border-top:    1px solid #000; }

/* ── ROW 1: Logo + Horizontal Barcode ── */
.r-logo-bar {
  display: flex;
  align-items: stretch;
  border-bottom: 1.5px solid #000;
  flex-shrink: 0;
  height: 22mm;
}
.logo-box {
  width: 38mm;
  display: flex;
  align-items: center;
  padding: 5px 8px;
  border-right: 1.5px solid #000;
  flex-shrink: 0;
}
.logo-text {
  font-size: 26pt;
  font-weight: 900;
  color: #481DBC;
  letter-spacing: -1px;
  line-height: 1;
}
.logo-sub {
  font-size: 6pt;
  color: #888;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 3px;
}
.bar-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  padding: 3px 5px 2px;
}
.bar-box svg { width: 100%; height: 30px; }
.tracking-no {
  font-size: 7.5pt;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin-top: 1px;
}

/* ── ROW 2: Origin | Destination | Meta ── */
.r-cities {
  display: flex;
  border-bottom: 1.5px solid #000;
  flex-shrink: 0;
  height: 22mm;
}
.city-col {
  width: 28mm;
  flex-shrink: 0;
  padding: 3px 5px;
  border-right: 1px solid #000;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.city-lbl  { font-size: 5.5pt; color: #666; margin-bottom: 1px; }
.city-code { font-size: 28pt; font-weight: 900; line-height: 1; color: #000; }
.meta-col {
  flex: 1;
  padding: 3px 6px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 2px;
}
.meta-line { display: flex; align-items: baseline; gap: 3px; }
.meta-k { font-size: 6pt; color: #666; width: 55px; flex-shrink: 0; }
.meta-v { font-size: 7pt; font-weight: 700; }

/* ── ROW 3: Service Code Boxes ── */
.r-svc-codes {
  display: flex;
  border-bottom: 1.5px solid #000;
  flex-shrink: 0;
}
.svc-box {
  flex: 1;
  text-align: center;
  padding: 5px 2px;
  font-size: 20pt;
  font-weight: 900;
  line-height: 1;
  border-right: 1.5px solid #000;
  letter-spacing: 0.5px;
}
.svc-box:last-child { border-right: none; }
.svc-box.inv { background: #000; color: #fff; }

/* ── ROW 4: Pieces / Weight / Chargeable ── */
.r-weights {
  display: flex;
  border-bottom: 1px solid #000;
  flex-shrink: 0;
}
.wt-cell {
  flex: 1;
  padding: 3px 5px;
  border-right: 1px solid #000;
  font-size: 7pt;
}
.wt-cell:last-child { border-right: none; }
.wt-cell .wk { font-size: 5.5pt; color: #666; display: block; }
.wt-cell .wv { font-size: 9pt; font-weight: 900; }

/* ── ROW 5: Services bar (black) ── */
.r-svc-bar {
  background: #000;
  color: #fff;
  padding: 3px 6px;
  font-size: 8pt;
  font-weight: 700;
  letter-spacing: 0.3px;
  border-bottom: 1px solid #000;
  flex-shrink: 0;
}

/* ── ROW 6: COD (hidden if 0) ── */
.r-cod {
  display: none;
  padding: 3px 6px;
  border-bottom: 1px solid #000;
  flex-shrink: 0;
  align-items: center;
  gap: 6px;
}
.r-cod.show { display: flex; }
.cod-lbl { font-size: 6pt; color: #666; }
.cod-val { font-size: 12pt; font-weight: 900; color: #c00; }
.cod-cur { font-size: 8pt; font-weight: 700; }
.cod-customs { margin-left: auto; font-size: 6pt; color: #666; }

/* ── ROW 7: Account ── */
.r-account {
  padding: 3px 6px;
  border-bottom: 1.5px solid #000;
  flex-shrink: 0;
}
.acct-lbl { font-size: 5.5pt; color: #666; }
.acct-no  { font-size: 12pt; font-weight: 900; line-height: 1.1; }
.acct-store { font-size: 8pt; font-weight: 700; }

/* ── ROW 8: Addresses (grow) + Vertical Barcode ── */
.r-addresses {
  display: flex;
  flex: 1;
  border-bottom: 1.5px solid #000;
  min-height: 0;
}
.addr-block {
  flex: 1;
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
  overflow: hidden;
}
.addr-top, .addr-bottom {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.addr-divider {
  height: 1px;
  background: #000;
  margin: 4px 0;
  flex-shrink: 0;
}
.addr-type { font-size: 5.5pt; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.addr-name { font-size: 10pt; font-weight: 900; line-height: 1.2; }
.addr-co   { font-size: 8pt; font-weight: 700; margin-bottom: 1px; }
.addr-line { font-size: 7pt; line-height: 1.5; }
.addr-phone { font-size: 8pt; font-weight: 700; margin-top: 3px; letter-spacing: 0.5px; }

/* vertical barcode column */
.vbar-col {
  width: 13mm;
  flex-shrink: 0;
  border-left: 1px solid #000;
  position: relative;
  overflow: hidden;
}
.vbar-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(90deg);
}
.vbar-inner svg {
  display: block;
  width: 56mm;
  height: 11mm;
}

/* ── ROW 9: Footer refs ── */
.r-footer {
  padding: 2px 5px;
  font-size: 5.5pt;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.footer-row { display: flex; gap: 12px; }
.footer-row span { color: #333; }
.footer-row strong { font-size: 6.5pt; }

/* ── PRINT ── */
@media print {
  body { background: #fff; padding: 0; margin: 0; }
  .actions { display: none !important; }
  .label {
    width: 148mm;
    height: 210mm;
    border: 1px solid #000;
    box-shadow: none;
    page-break-inside: avoid;
  }
  @page { margin: 0; size: A5 portrait; }
}
</style>
</head>
<body>

<!-- ACTIONS -->
<div class="actions">
  <button class="btn btn-back" onclick="history.back()">&#8592; Back</button>
  <button class="btn btn-print" onclick="window.print()">&#128438; Print Label</button>
</div>

<!-- ═══════════════ LABEL ═══════════════ -->
<div class="label">

  <!-- ROW 1: LOGO + BARCODE -->
  <div class="r-logo-bar">
    <div class="logo-box">
      <div style="display:flex;flex-direction:column;">
        <!-- Try image first, fallback to text -->
        <img id="logo-img" src="logo.png" alt="MADAR"
             style="height:44px;max-width:100%;object-fit:contain;object-position:left;"
             onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'">
        <div id="logo-fallback" style="display:none;">
          <div class="logo-text">MADAR</div>
        </div>
        <div class="logo-sub">Logistics</div>
      </div>
    </div>
    <div class="bar-box">
      <svg id="barcode-h"></svg>
      <div class="tracking-no" id="tracking-display"></div>
    </div>
  </div>

  <!-- ROW 2: ORIGIN | DESTINATION | META -->
  <div class="r-cities">
    <div class="city-col">
      <div class="city-lbl">Origin:</div>
      <div class="city-code" id="city-origin">RUH</div>
    </div>
    <div class="city-col" style="border-right:1.5px solid #000;">
      <div class="city-lbl">Destination:</div>
      <div class="city-code" id="city-dest">RUH</div>
    </div>
    <div class="meta-col">
      <div class="meta-line"><span class="meta-k">Date:</span><span class="meta-v" id="meta-date"></span></div>
      <div class="meta-line"><span class="meta-k">Order Ref:</span><span class="meta-v" id="meta-order"></span></div>
      <div class="meta-line"><span class="meta-k">Merchant ID:</span><span class="meta-v" id="meta-merchant"></span></div>
      <div class="meta-line"><span class="meta-k">Pieces:</span><span class="meta-v" id="meta-pieces">1</span></div>
    </div>
  </div>

  <!-- ROW 3: SERVICE CODE BOXES -->
  <div class="r-svc-codes">
    <div class="svc-box" id="svc-a">DOM</div>
    <div class="svc-box inv" id="svc-b">EXP</div>
    <div class="svc-box" id="svc-c">P</div>
  </div>

  <!-- ROW 4: WEIGHT / CHARGEABLE -->
  <div class="r-weights">
    <div class="wt-cell">
      <span class="wk">Weight:</span>
      <span class="wv" id="wt-weight">0.5 KG</span>
    </div>
    <div class="wt-cell">
      <span class="wk">Chargeable:</span>
      <span class="wv" id="wt-charge">0.5 KG</span>
    </div>
    <div class="wt-cell">
      <span class="wk">Package:</span>
      <span class="wv" id="wt-pkg">Parcel</span>
    </div>
  </div>

  <!-- ROW 5: SERVICES BAR -->
  <div class="r-svc-bar">Services: <span id="svc-bar-txt">Standard Delivery</span></div>

  <!-- ROW 6: COD -->
  <div class="r-cod" id="cod-row">
    <span class="cod-lbl">Cash on Delivery:</span>
    <span class="cod-val" id="cod-amount"></span>
    <span class="cod-cur">SAR</span>
    <span class="cod-customs">Customs: &mdash;</span>
  </div>

  <!-- ROW 7: ACCOUNT -->
  <div class="r-account">
    <div class="acct-lbl">Account</div>
    <div class="acct-no" id="acct-no">MAD-00000</div>
    <div class="acct-store" id="acct-store"></div>
  </div>

  <!-- ROW 8: ADDRESSES + VERTICAL BARCODE -->
  <div class="r-addresses">
    <div class="addr-block">

      <!-- CONSIGNEE -->
      <div class="addr-top">
        <div class="addr-type">Consignee</div>
        <div class="addr-co"  id="to-co"></div>
        <div class="addr-name" id="to-name"></div>
        <div class="addr-line" id="to-addr"></div>
        <div class="addr-line" id="to-city"></div>
        <div class="addr-phone" id="to-phone"></div>
      </div>

      <div class="addr-divider"></div>

      <!-- SHIPPER -->
      <div class="addr-bottom">
        <div class="addr-type">Shipper</div>
        <div class="addr-name" id="from-name"></div>
        <div class="addr-line" id="from-addr"></div>
        <div class="addr-line" id="from-city"></div>
        <div class="addr-phone" id="from-phone"></div>
      </div>

    </div>

    <!-- VERTICAL BARCODE -->
    <div class="vbar-col">
      <div class="vbar-inner">
        <svg id="barcode-v"></svg>
      </div>
    </div>
  </div>

  <!-- ROW 9: FOOTER -->
  <div class="r-footer">
    <div class="footer-row">
      <span>Shipper Ref: <strong id="footer-order"></strong></span>
      <span>Consignee Ref: <strong id="footer-tracking"></strong></span>
    </div>
    <div class="footer-row">
      <span>Description: <strong id="footer-desc"></strong></span>
      <span style="margin-left:auto;color:#999;">madarlogistic.com</span>
    </div>
  </div>

</div><!-- /label -->

<script>
/* ── MAPS ── */
const CITY_CODE = {
  'الرياض':'RUH','جدة':'JED','الدمام':'DMM','مكة المكرمة':'MEC',
  'المدينة المنورة':'MED','الطائف':'TIF','أبها':'AHB','تبوك':'TUU',
  'حائل':'HAS','جازان':'GIZ','نجران':'EAM','الباحة':'ABT',
  'القصيم':'ULH','عرعر':'RAE','سكاكا':'AJF'
};
const SVC_MAP = {
  'شحن':'Standard Delivery',
  'شحن وتخزين':'Express + Storage',
  'تخزين وشحن':'Express + Storage'
};
const SVC_CODE_MAP = {
  'شحن':'STD','شحن وتخزين':'EXP','تخزين وشحن':'EXP'
};
const PKG_MAP = {
  'عادي':'Parcel','مجمد':'Frozen','هش':'Fragile','ثقيل':'Heavy'
};
const PKG_CODE_MAP = {
  'عادي':'P','مجمد':'F','هش':'F','ثقيل':'H'
};

/* ── LOAD DATA ── */
let D = {};
try { D = JSON.parse(localStorage.getItem('madar_label') || '{}'); } catch(e) {}

/* URL params fallback */
if (!D.tracking) {
  const p = new URLSearchParams(location.search);
  if (p.get('tracking')) {
    ['tracking','id','toName','toAddr','toPhone','fromName','fromAddr','fromPhone',
     'city','fromCity','service','weight','pieces','pkg','cod','desc','merchantId','storeName']
    .forEach(k => { if (p.get(k)) D[k] = p.get(k); });
  }
}

/* Demo data if nothing */
if (!D.tracking) {
  D = {
    tracking:'MDR202500001', id:'ORD-2025-001',
    toName:'Ahmed Al-Rashidi', toAddr:'King Fahd Road, Al Olaya District',
    toPhone:'0501234567',
    fromName:'Store Manager', fromAddr:'Industrial Area, Riyadh', fromPhone:'0112345678',
    city:'الرياض', fromCity:'الرياض', service:'شحن',
    weight:'1.5', pieces:'1', pkg:'عادي', cod:'150',
    desc:'General Merchandise', merchantId:'MAD-10399', storeName:'Al Amal Trading'
  };
}

/* ── POPULATE ── */
const originCode = CITY_CODE[D.fromCity || 'الرياض'] || 'RUH';
const destCode   = CITY_CODE[D.city]   || 'RUH';

document.getElementById('city-origin').textContent = originCode;
document.getElementById('city-dest').textContent   = destCode;
document.getElementById('tracking-display').textContent = D.tracking;
document.getElementById('meta-date').textContent   = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('meta-order').textContent  = D.id || '';
document.getElementById('meta-merchant').textContent = D.merchantId || '';
document.getElementById('meta-pieces').textContent = D.pieces || '1';

document.getElementById('svc-a').textContent = 'DOM';
document.getElementById('svc-b').textContent = SVC_CODE_MAP[D.service] || 'STD';
document.getElementById('svc-c').textContent = PKG_CODE_MAP[D.pkg]     || 'P';

document.getElementById('wt-weight').textContent = (D.weight||'0.5') + ' KG';
document.getElementById('wt-charge').textContent = (D.weight||'0.5') + ' KG';
document.getElementById('wt-pkg').textContent    = PKG_MAP[D.pkg]    || 'Parcel';
document.getElementById('svc-bar-txt').textContent = SVC_MAP[D.service] || 'Standard Delivery';

const cod = parseFloat(D.cod||0);
if (cod > 0) {
  document.getElementById('cod-row').classList.add('show');
  document.getElementById('cod-amount').textContent = cod.toFixed(2);
}

document.getElementById('acct-no').textContent    = D.merchantId || '';
document.getElementById('acct-store').textContent = D.storeName  || '';

document.getElementById('to-co').textContent      = D.storeName  || '';
document.getElementById('to-name').textContent    = D.toName     || '';
document.getElementById('to-addr').textContent    = D.toAddr     || '';
document.getElementById('to-city').textContent    = (D.city ? (CITY_CODE[D.city]||D.city) : '') + '  SA';
document.getElementById('to-phone').textContent   = D.toPhone    || '';

document.getElementById('from-name').textContent  = D.fromName   || '';
document.getElementById('from-addr').textContent  = D.fromAddr   || '';
document.getElementById('from-city').textContent  = (D.fromCity ? (CITY_CODE[D.fromCity]||D.fromCity) : 'Riyadh') + '  SA';
document.getElementById('from-phone').textContent = D.fromPhone  || '';

document.getElementById('footer-order').textContent    = D.id       || '';
document.getElementById('footer-tracking').textContent = D.tracking;
document.getElementById('footer-desc').textContent     = D.desc     || 'General Goods';

/* ── BARCODES ── */
JsBarcode('#barcode-h', D.tracking, {
  format:'CODE128', width:1.5, height:36,
  displayValue:false, margin:0,
  background:'#ffffff', lineColor:'#000000'
});
JsBarcode('#barcode-v', D.tracking, {
  format:'CODE128', width:1.2, height:28,
  displayValue:false, margin:0,
  background:'#ffffff', lineColor:'#000000'
});
</script>
</body>
</html>
